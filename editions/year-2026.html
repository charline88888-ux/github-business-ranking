  const tierCounts = { all: items.length, S: sCount, A: aCount, B: items.filter(i => i.commercial?.tier === "B").length, C: items.filter(i => i.commercial?.tier === "C").length };
  const mk = (label, val, cls) => { const el = document.createElement("div"); el.className = "chip " + (cls || ""); el.dataset.tier = val; el.textContent = label; return el; };
  [["全部", "all", ""], ["S 级", "S", "tier-S"], ["A 级", "A", "tier-A"], ["B 级", "B", "tier-B"], ["C 级", "C", "tier-C"]].forEach(([label, val, cls]) => {
    const el = mk(label + " " + (tierCounts[val] ?? 0), val, cls);
    if (val === "all") el.classList.add("active");
    tierChips.appendChild(el);
  });
  tierChips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state.tier = chip.dataset.tier;
    tierChips.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === chip));
    render();
  });

  // category chips
  const chips = $("#chips");
  const allChip = document.createElement("div");
  allChip.className = "chip active"; allChip.dataset.cat = "all"; allChip.textContent = "全部分类";
  chips.appendChild(allChip);
  for (const c of report.categories) {
    const n = items.filter(i => i.categoryId === c.id).length;
    if (!n) continue;
    const el = document.createElement("div");
    el.className = "chip"; el.dataset.cat = c.id; el.innerHTML = c.emoji + " " + esc(c.name) + ' <span class="n">' + n + "</span>";
    chips.appendChild(el);
  }
  if (userCount) {
    const el = document.createElement("div");
    el.className = "chip"; el.dataset.cat = "__user";
    el.innerHTML = '📥 用户收录 <span class="n">' + userCount + "</span>";
    chips.appendChild(el);
  }
  chips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state.cat = chip.dataset.cat;
    chips.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === chip));
    render();
  });

  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#expandAll").addEventListener("click", () => {
    const list = filtered();
    const allOpen = list.every(i => state.open.has(i.fullName));
    if (allOpen) state.open.clear(); else list.forEach(i => state.open.add(i.fullName));
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
    if (e.key === "Escape") $("#q").blur();
  });

  function filtered() {
    let list = items.filter(it => {
      if (state.tier !== "all" && it.commercial?.tier !== state.tier) return false;
      if (state.cat === "__user") { if (it.source !== "user-search") return false; }
      else if (state.cat !== "all" && it.categoryId !== state.cat) return false;
      if (!state.q) return true;
      const hay = [it.name, it.fullName, it.tagline, it.audience, it.commercial?.monetization, it.commercial?.rationale, it.source === "user-search" ? "用户收录 收录" : "", ...(it.tags || []), ...(it.features || []), ...(it.scenarios || [])].join(" ").toLowerCase();
      return hay.includes(state.q);
    });
    const cmp = {
      rank: (a, b) => a.rank - b.rank,
      score: (a, b) => (b.commercial?.score || 0) - (a.commercial?.score || 0),
      period: (a, b) => (b.periodStars || 0) - (a.periodStars || 0),
      stars: (a, b) => (b.stars || 0) - (a.stars || 0),
      name: (a, b) => a.name.localeCompare(b.name),
    }[state.sort];
    return list.sort(cmp);
  }

  function bar(label, val, color) {
    return `<div class="bar"><span>${label}</span><span class="track"><span class="fill" style="width:${(val / 20) * 100}%;${color ? "background:" + color : ""}"></span></span><span>${val}</span></div>`;
  }

  function cardHTML(it) {
    const cat = cats.get(it.categoryId) || { name: "其他", color: "#94a3b8", emoji: "📦" };
    const lc = langColors[it.language] || "#94a3b8";
    const c = it.commercial || {};
    const open = state.open.has(it.fullName);
    const tier = c.tier || "C";
    return `
    <article class="card tier-${tier} ${it.rank <= 3 ? "top" + it.rank : ""} ${open ? "open" : ""}" data-name="${esc(it.fullName)}" id="${esc(it.fullName)}">
      <div class="glow"></div>
      <div class="inner">
        <div class="card-head">
          <div class="rank">${it.rank ?? "—"}</div>
          <div class="card-title">
            <div class="name">${esc(it.name)}</div>
            <div class="owner">${esc(it.fullName)}</div>
          </div>
          <span class="cat" style="--c:${cat.color}">${cat.emoji} ${esc(cat.name)}</span>
        </div>
        <p class="tagline">${esc(it.tagline)}</p>
        <div class="meta">
          ${it.source === "user-search" ? '<span class="user-pill" title="用户关键词搜索 + 商业价值评估后收录">📥 用户收录</span>' : ""}
          <span class="tier-badge ${tier}">${tier} 级</span>
          <span class="lang"><i style="background:${lc}"></i>${esc(it.language || "—")}</span>
          <span class="stars">★ <b>${fmt(it.stars)}</b></span>
          <span class="period-up">↑ ${fmt(it.periodStars || 0)} ${report.period === "year" ? "/ 年" : report.period === "week" ? "/ 周" : "/ 月"}</span>
          <span>${esc(it.license || "未声明")}</span>
        </div>
        <div class="score-line"><span class="score">${c.score ?? "-"}</span><span class="label">商业价值分</span><span class="money">${esc(c.monetization || "")}</span></div>
        <div class="tags">${(it.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="actions">
          <button class="btn toggle">${open ? "收起详情" : "展开详情"}</button>
          <a class="btn gh" href="${esc(it.url)}" target="_blank" rel="noreferrer" title="打开 GitHub">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </div>
      </div>
      <div class="details">
        <div class="section"><h4>功能亮点</h4><ul>${(it.features || []).map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
        <div class="section">
          <h4>安装方式</h4>
          <div class="install-box">
            <div class="cmd"><span class="prompt">$</span><span class="cmd-text">${esc(it.install)}</span><button class="copy" data-cmd="${esc(it.install)}">复制</button></div>
            ${(it.installSteps || []).length ? `<ol>${it.installSteps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
          </div>
          ${it.installNote ? `<div class="install-note">⚠ ${esc(it.installNote)}</div>` : ""}
        </div>
        <div class="section"><h4>适用场景</h4><div class="scenarios">${(it.scenarios || []).map(s => `<span>${esc(s)}</span>`).join("")}</div></div>
        <div class="section"><h4>适合人群</h4><div class="audience">${esc(it.audience)}</div></div>
        <div class="section"><h4>上榜理由</h4><div class="highlight">${esc(it.highlight)}</div></div>
        <div class="section">
          <h4>商业价值分析</h4>
          <div class="biz">
            <div class="biz-head"><span class="big">${c.score ?? "-"}</span><span class="of">/ 100 · <span class="tier-badge ${tier}">${tier} 级</span></span></div>
            <div class="bars">
              ${bar("市场需求", c.dimensions?.market ?? 0)}
              ${bar("变现路径", c.dimensions?.monetization ?? 0)}
              ${bar("可集成性", c.dimensions?.integration ?? 0)}
              ${bar("壁垒", c.dimensions?.moat ?? 0)}
              ${bar("成熟度", c.dimensions?.execution ?? 0)}
            </div>
            <div class="biz-row"><b>变现方向</b><span>${esc(c.monetization || "-")}</span></div>
            <div class="biz-row"><b>推荐理由</b><span>${esc(c.rationale || "-")}</span></div>
            ${c.risk ? `<div class="biz-row risk"><b>风险提示</b><span>${esc(c.risk)}</span></div>` : ""}
          </div>
        </div>
        <div class="links">
          <a href="${esc(it.url)}" target="_blank" rel="noreferrer">GitHub 仓库 ↗</a>
          ${it.homepage ? `<a href="${esc(it.homepage)}" target="_blank" rel="noreferrer">官网 ↗</a>` : ""}
        </div>
      </div>
    </article>`;
  }

  function bind() {
    grid.querySelectorAll(".card .toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".card"); const name = card.dataset.name;
        if (state.open.has(name)) state.open.delete(name); else state.open.add(name);
        render();
      });
    });
    grid.querySelectorAll(".card .copy").forEach(btn => {
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.cmd);
          btn.textContent = "已复制"; btn.classList.add("done");
          setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("done"); }, 1300);
        } catch { toast("复制失败，请手动选择命令"); }
      });
    });
  }

  function render() {
    const list = filtered();
    $("#count").textContent = `显示 ${list.length} / ${items.length} 个项目`;
    $("#expandAll").textContent = list.length && list.every(i => state.open.has(i.fullName)) ? "收起全部" : "展开全部";
    grid.innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">没有匹配的项目，试试别的关键词、分级或分类。</div>`;
    bind();
  }

  let toastTimer;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }
  render();
})();
</script>
</body>
</html>
