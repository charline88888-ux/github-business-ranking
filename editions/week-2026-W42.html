      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.cmd);
          btn.textContent = "已复制"; btn.classList.add("done");
          setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("done"); }, 1300);
        } catch { toast("复制失败，请手动选择命令"); }
      });
    });
  }

  function render() {
    const list = filtered();
    $("#count").textContent = `显示 ${list.length} / ${items.length} 个项目`;
    $("#expandAll").textContent = list.length && list.every(i => state.open.has(i.fullName)) ? "收起全部" : "展开全部";
    grid.innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">没有匹配的项目，试试别的关键词、分级或分类。</div>`;
    bind();
  }

  let toastTimer;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }
  render();
})();
</script>
</body>
</html>
