    ["成熟度", "发布节奏、活跃度、许可证与社区"],
  ].map(([k, v]) => `<div class="dim"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  $("#tiers").innerHTML = `<span>分级：</span><span class="tier S">S ≥ 85 强烈推荐</span><span class="tier A">A 75–84 重点关注</span><span class="tier B">B 60–74 可关注</span><span class="tier C">C &lt; 60 观察</span>`;

  // archive
  const groups = { week: [], month: [], year: [] };
  for (const a of DATA.archive) groups[a.period].push(a);
  $("#archive").innerHTML = ["week", "month", "year"].map((p) => {
    const arr = groups[p];
    if (!arr.length) return "";
    return `<div class="arch-group"><h3>${periodNames[p]} · ${arr.length} 期</h3><div class="archive">${arr.map(a => `<a class="arch-item" href="${esc(a.file)}"><span class="t">${esc(a.title)} · ${esc(a.label)}</span><span class="d">${esc(a.periodText)} · ${a.count} 个项目</span></a>`).join("")}</div></div>`;
  }).join("");

  $("#cadence").textContent = DATA.cadence;
})();
</script>
</body>
</html>
