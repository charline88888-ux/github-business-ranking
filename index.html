    box.style.display = "";
    box.innerHTML = included.map((it) => `<a class="pick" href="${esc(it.editionFile)}#${esc(it.fullName)}">
      <span class="score">${it.commercial?.score ?? "-"}</span>
      <span class="info"><span class="nm">${incBadge(it)}${esc(it.name)} <span style="color:var(--dim);font-weight:500">· ${esc(it.fullName)}</span></span>
      <span class="one">${esc(it.tagline || it.commercial?.monetization || "")}${it.source === "commercial-discovery" ? (Array.isArray(it.discoveredBy) && it.discoveredBy.length ? " · 发现策略：" + esc(it.discoveredBy.join(" / ")) : "") : (it.keyword ? " · 关键词：" + esc(it.keyword) : "")}</span></span>
      <span class="tags"><span class="${tierCls(it.commercial?.tier)}">${esc(it.commercial?.tier || "C")}</span></span>
    </a>`).join("");
  }

  // rubric
  $("#rubric").innerHTML = [
    ["市场需求", "总 Star、本期新增、增速与榜单热度"],
    ["变现路径", "订阅/API/企业版/云服务/许可证等收费信号"],
    ["可集成性", "API/SDK/CLI/MCP/插件生态与文档完善度"],
    ["壁垒", "技术独特性、生态位、数据与网络效应"],
    ["成熟度", "发布节奏、活跃度、许可证与社区"],
  ].map(([k, v]) => `<div class="dim"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  $("#tiers").innerHTML = `<span>分级：</span><span class="tier S">S ≥ 85 强烈推荐</span><span class="tier A">A 75–84 重点关注</span><span class="tier B">B 60–74 可关注</span><span class="tier C">C &lt; 60 观察</span>`;

  // archive
  const groups = { week: [], month: [], year: [] };
  for (const a of DATA.archive) groups[a.period].push(a);
  $("#archive").innerHTML = ["week", "month", "year"].map((p) => {
    const arr = groups[p];
    if (!arr.length) return "";
    return `<div class="arch-group"><h3>${periodNames[p]} · ${arr.length} 期</h3><div class="archive">${arr.map(a => `<a class="arch-item" href="${esc(a.file)}"><span class="t">${esc(a.title)} · ${esc(a.label)}</span><span class="d">${esc(a.periodText)} · ${a.count} 个项目</span></a>`).join("")}</div></div>`;
  }).join("");

  $("#cadence").textContent = DATA.cadence;
})();
</script>
</body>
</html>
